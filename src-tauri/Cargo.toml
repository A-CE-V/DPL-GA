[package]
name    = "deploy-launcher"
version = "1.0.0"
edition = "2021"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true

[lib]
name       = "deploy_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deploy-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                 = { version = "2", features = [] }
tauri-plugin-shell    = { version = "2" }
tauri-plugin-http     = { version = "2" }
tauri-plugin-os       = { version = "2" }
tauri-plugin-updater  = { version = "2" }  # Phase 7 — launcher self-update
tauri-plugin-process  = { version = "2" }  # Phase 7 — relaunch after update
tauri-plugin-fs = { version = "2" }

serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1",    features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "stream"] }
zip          = "2"
dirs         = "5"
futures-util = "0.3"
anyhow       = "1"
hostname     = "0.3"
mac_address  = "1.1"

# NEW — download resume + SHA-256 verification.
# Both already existed as transitive dependencies (confirmed in Cargo.lock
# before this change), so promoting them to direct dependencies here should
# resolve to the same versions already in the tree with no new conflicts.
sha2         = "0.10"
hex          = "0.4"

# NEW — image caching (screenshots/logo loaded from dev-supplied URLs).
# Cached bytes are returned to the frontend as base64 data URLs rather than
# served through Tauri's asset:// protocol, specifically to avoid touching
# tauri.conf.json's asset-protocol scope or any capabilities/*.json file —
# given the recent stale-permissions build issue on this project, anything
# that could add a NEW permission surface gets avoided in favor of a plain
# IPC return value.
base64       = "0.22"
